version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: var-naming
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zahra-ove/ticketing
