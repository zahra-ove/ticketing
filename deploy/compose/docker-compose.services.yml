# Application services. Used together with docker-compose.infra.yml:
#   make services-up
name: ticketing

x-go-build: &go-build
  context: ../..
  dockerfile: Dockerfile
  args: &go-build-args
    GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    VERSION: ${VERSION:-dev}

# Standard OpenTelemetry SDK variables, shared by every service.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
  OTEL_TRACES_SAMPLER: parentbased_always_on # sample everything locally; use a ratio in production
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:
  # One-shot job: creates the topics with explicit partitions instead of
  # relying on auto-creation. Messages are keyed by booking id, so a booking's
  # events stay ordered within a partition.
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in ticketing.booking.events.v1 ticketing.payment.events.v1; do
          rpk topic create "$$t" "$$t.dlq" --brokers redpanda:9092 -p 3 -r 1 || true
        done
        rpk topic list --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    networks: [ticketing]

  # One-shot job: applies migrations, then exits. The service starts only after it succeeds.
  event-migrate:
    image: ticketing/event:${VERSION:-dev}
    build:
      <<: *go-build
      args:
        <<: *go-build-args
        SERVICE: event
    command: ["migrate"]
    environment:
      DB_URL: postgres://event:${EVENT_DB_PASSWORD}@postgres:5432/event?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [ticketing]

  event:
    image: ticketing/event:${VERSION:-dev}
    build:
      <<: *go-build
      args:
        <<: *go-build-args
        SERVICE: event
    command: ["serve"]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9000" # internal API, only reachable inside the network
      DB_URL: postgres://event:${EVENT_DB_PASSWORD}@postgres:5432/event?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *otel-env
    ports:
      - "${EVENT_HTTP_PORT:-8081}:8080"
    depends_on:
      event-migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck: &go-healthcheck
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s # longer than SHUTDOWN_TIMEOUT, so draining is never cut short
    networks: [ticketing]

  booking-migrate:
    image: ticketing/booking:${VERSION:-dev}
    build:
      <<: *go-build
      args:
        <<: *go-build-args
        SERVICE: booking
    command: ["migrate"]
    environment:
      DB_URL: postgres://booking:${BOOKING_DB_PASSWORD}@postgres:5432/booking?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [ticketing]

  booking:
    image: ticketing/booking:${VERSION:-dev}
    build:
      <<: *go-build
      args:
        <<: *go-build-args
        SERVICE: booking
    command: ["serve"]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DB_URL: postgres://booking:${BOOKING_DB_PASSWORD}@postgres:5432/booking?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EVENT_GRPC_ADDR: event:9000
      KAFKA_BROKERS: redpanda:9092
      HOLD_TTL: ${HOLD_TTL:-10m}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-15m}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-30s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *otel-env
    ports:
      - "${BOOKING_HTTP_PORT:-8082}:8080"
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck: *go-healthcheck
    stop_grace_period: 20s
    networks: [ticketing]

  payment-migrate:
    image: ticketing/payment:${VERSION:-dev}
    build:
      <<: *go-build
      args:
        <<: *go-build-args
        SERVICE: payment
    command: ["migrate"]
    environment:
      DB_URL: postgres://payment:${PAYMENT_DB_PASSWORD}@postgres:5432/payment?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [ticketing]

  payment:
    image: ticketing/payment:${VERSION:-dev}
    build:
      <<: *go-build
      args:
        <<: *go-build-args
        SERVICE: payment
    command: ["serve"]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DB_URL: postgres://payment:${PAYMENT_DB_PASSWORD}@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      PROVIDER_LATENCY: ${PROVIDER_LATENCY:-200ms}
      PROVIDER_FAILURE_RATE: ${PROVIDER_FAILURE_RATE:-0.1} # transient errors, to exercise retries
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *otel-env
    ports:
      - "${PAYMENT_HTTP_PORT:-8083}:8080"
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck: *go-healthcheck
    stop_grace_period: 20s
    networks: [ticketing]
