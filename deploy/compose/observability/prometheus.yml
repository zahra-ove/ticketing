global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Application metrics arrive over OTLP from the collector, so no service is
# scraped. These resource attributes become labels on every series; job and
# instance are derived from service.name and service.instance.id.
otlp:
  promote_resource_attributes:
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
