# Single-process Loki for local development.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion: log attributes (trace_id, span_id, ...) are
  # stored as structured metadata instead of high-cardinality labels.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
